<!DOCTYPE html>
<html>

<head>
    <title>Cinemoji</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="fonts/fonts.css">
    <style>
        body {
            /* the canvas fills the window; white matches the game's pages, so
               a rounding pixel at an edge never shows as a coloured line */
            background-color: #ffffff;
            overflow: hidden;
            margin: auto;
            width: 100%;
        }
        
        /* The loading page, dressed like the game: the menu's off-white paper
           with the active chapter card's mint wash, a row of emoji tiles
           hopping the way the answer tiles do, and the menu's
           own yellow-on-grey progress bar. It is plain HTML so it is up before
           the game's code has even arrived; BootScene fills the bar and the
           menu fades it away. */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 34px;
            padding: 0 16px;
            background:
                radial-gradient(ellipse 95% 50% at 50% 100%,
                    #e2fbe8 0%,
                    rgba(226, 251, 232, 0) 100%),
                #fbfbfb;
            color: #57575b;
            font-family: 'FredokaOne_Regular', 'Arial Rounded MT Bold', sans-serif;
            transition: opacity 350ms ease-out;
        }

        #loader.done {
            opacity: 0;
            pointer-events: none;
        }

        /* four white tiles, like the ones the answers are picked from */
        #loader-tiles {
            display: flex;
            gap: 12px;
        }

        #loader-tiles i {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 58px;
            height: 58px;
            box-sizing: border-box;
            border-radius: 16px;
            background: #ffffff;
            border: 1px solid #eeeef0;
            box-shadow: 0 4px 10px rgba(27, 32, 44, 0.08);
            animation: loader-hop 1.4s ease-in-out infinite;
        }

        /* the emoji itself: one 46px window onto the strip of popcorn,
           clapper, tears of joy and star */
        #loader-tiles i::before {
            content: '';
            width: 46px;
            height: 46px;
            background-image: url('assets/loader/emoji.png');
            background-repeat: no-repeat;
            background-size: 184px 46px;
        }

        #loader-tiles i:nth-child(2) { animation-delay: 0.14s; }
        #loader-tiles i:nth-child(3) { animation-delay: 0.28s; }
        #loader-tiles i:nth-child(4) { animation-delay: 0.42s; }
        #loader-tiles i:nth-child(2)::before { background-position: -46px 0; }
        #loader-tiles i:nth-child(3)::before { background-position: -92px 0; }
        #loader-tiles i:nth-child(4)::before { background-position: -138px 0; }

        #loader-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        #loader-track {
            width: min(70vw, 280px);
            height: 18px;
            border-radius: 999px;
            background: #dddee1;
            overflow: hidden;
        }

        #loader-fill {
            position: relative;
            height: 100%;
            width: 8%;
            border-radius: 999px;
            background: #feca31;
            transition: width 220ms ease-out;
        }

        /* the glossy top edge the logo's yellow letters have */
        #loader-fill::after {
            content: '';
            position: absolute;
            left: 7px;
            right: 7px;
            top: 3px;
            height: 4px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.5);
        }

        #loader-text {
            font-size: 20px;
            letter-spacing: 0.5px;
        }

        /* a squash before the jump and on landing, like the game's tiles */
        @keyframes loader-hop {
            0%, 55%, 100% { transform: translateY(0) scale(1, 1); }
            8% { transform: translateY(0) scale(1.08, 0.9); }
            25% { transform: translateY(-14px) scale(0.95, 1.06); }
            45% { transform: translateY(0) scale(1.06, 0.93); }
        }

        @media (prefers-reduced-motion: reduce) {
            #loader-tiles i { animation: none; }
        }
    </style>
</head>

<body>
    <div id="loader">
        <div id="loader-tiles" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div id="loader-bar">
            <div id="loader-track"><div id="loader-fill"></div></div>
            <div id="loader-text">Loading...</div>
        </div>
    </div>

    <script>
        // BootScene reports how much has arrived (0..1); the bar never starts
        // empty, so it reads as already on its way while the code downloads.
        window.setLoaderProgress = function(progress) {
            var fill = document.getElementById('loader-fill');
            if (fill) fill.style.width = (8 + Math.max(0, Math.min(1, progress)) * 92) + '%';
        };

        // the menu is up underneath: fade the page off it, then drop it
        window.hideLoader = function() {
            var loader = document.getElementById('loader');
            if (!loader || loader.classList.contains('done')) return;
            loader.classList.add('done');
            setTimeout(function() {
                if (loader.parentNode) loader.parentNode.removeChild(loader);
            }, 400);
        };
    </script>

    <script>
        // Load Web Fonts
        var fonts = ['FredokaOne_Regular.otf'];

        var fontDiv = document.createElement('fonts-to-load');
        document.body.appendChild(fontDiv);

        for (var i = 0; i < fonts.length; i++) {
            fonts[i] = fonts[i].substr(0, fonts[i].lastIndexOf('.'));

            var div = document.createElement('font-div');
            div.id = fonts[i];
            div.style.fontFamily = fonts[i];
            div.style.position = 'absolute';
            div.style.top = 0;
            div.style.left = 0;
            div.style.visibility = 'hidden';
            div.innerHTML = 'Hello world.';
            fontDiv.appendChild(div);
        }

        setTimeout(function() {
            document.body.removeChild(fontDiv);
        }, 500);
    </script>
<script type="text/javascript" src="bundle.min.js"></script></body>

</html>
